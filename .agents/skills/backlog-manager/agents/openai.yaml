interface:
  display_name: "Backlog Manager"
  short_description: "PRD를 Epic/Feature/UserStory/Task 백로그로 전환하고 영문 슬러그 디렉토리 계층을 생성하는 스킬"
  default_prompt: "$backlog-manager를 사용해 PRD를 Epic/Feature/UserStory/Task로 분해하고, 디렉토리명은 영문 소문자 슬러그(kebab-case)로 backlog 문서 계층을 생성해줘. GitHub MCP가 가능하면 계층 대칭 라벨(epic/feature/userstory/task)로 이슈 매핑도 포함해줘."
