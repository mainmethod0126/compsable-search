interface:
  display_name: "Backlog Manager"
  short_description: "PRD를 Epic/Feature/UserStory/Task로 분해하고, UI/UX 관련 기능은 구현 전 UI/UX 선행 백로그를 포함하도록 생성하는 스킬"
  default_prompt: "$backlog-manager를 사용해 PRD를 Epic/Feature/UserStory/Task로 분해해줘. UI/UX 관련 기능은 구현 전에 UI/UX 선행 UserStory/Task(시안, 프로토타입, 사용성 검증, 디자인 핸드오프)를 포함하고, 디렉토리명은 영문 소문자 슬러그(kebab-case)로 backlog 문서 계층을 생성해줘. GitHub MCP가 가능하면 계층 대칭 라벨(epic/feature/userstory/task)과 area 라벨까지 포함해 이슈 매핑해줘."
